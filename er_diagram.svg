<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bg3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#1F2937"/>
    </linearGradient>
    <filter id="shadow3" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="2" dy="4" stdDeviation="3" flood-opacity="0.3"/>
    </filter>
  </defs>

  <rect width="900" height="500" rx="12" fill="url(#bg3)"/>

  <text x="450" y="38" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#FFFFFF" text-anchor="middle">DATABASE SCHEMA &amp; ENTITY RELATIONSHIPS (DepotDB)</text>
  <text x="450" y="60" font-family="Arial, sans-serif" font-size="13" fill="#9CA3AF" text-anchor="middle">Microsoft SQL Server Relational Structure</text>

  <!-- Table 1: Users -->
  <rect x="40" y="90" width="220" height="160" rx="8" fill="#1F2937" stroke="#3B82F6" stroke-width="2" filter="url(#shadow3)"/>
  <rect x="40" y="90" width="220" height="35" rx="8" fill="#2563EB"/>
  <text x="150" y="113" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Users</text>
  <text x="55" y="145" font-family="Courier New, monospace" font-size="11" fill="#60A5FA">PK user_id (INT)</text>
  <text x="55" y="165" font-family="Courier New, monospace" font-size="11" fill="#E5E7EB">   username (VARCHAR)</text>
  <text x="55" y="185" font-family="Courier New, monospace" font-size="11" fill="#E5E7EB">   password (VARCHAR)</text>
  <text x="55" y="205" font-family="Courier New, monospace" font-size="11" fill="#E5E7EB">   full_name (VARCHAR)</text>
  <text x="55" y="225" font-family="Courier New, monospace" font-size="11" fill="#E5E7EB">   role (ADMIN/STAFF)</text>

  <!-- Table 2: Buses (Central Entity) -->
  <rect x="340" y="90" width="230" height="200" rx="8" fill="#1F2937" stroke="#10B981" stroke-width="2" filter="url(#shadow3)"/>
  <rect x="340" y="90" width="230" height="35" rx="8" fill="#059669"/>
  <text x="455" y="113" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Buses</text>
  <text x="355" y="145" font-family="Courier New, monospace" font-size="11" fill="#34D399">PK bus_id (INT)</text>
  <text x="355" y="165" font-family="Courier New, monospace" font-size="11" fill="#E5E7EB">   bus_number (VARCHAR)</text>
  <text x="355" y="185" font-family="Courier New, monospace" font-size="11" fill="#E5E7EB">   registration_no (VARCHAR)</text>
  <text x="355" y="205" font-family="Courier New, monospace" font-size="11" fill="#E5E7EB">   capacity (INT)</text>
  <text x="355" y="225" font-family="Courier New, monospace" font-size="11" fill="#E5E7EB">   status (ACTIVE/...)</text>
  <text x="355" y="245" font-family="Courier New, monospace" font-size="11" fill="#E5E7EB">   current_mileage (DOUBLE)</text>
  <text x="355" y="265" font-family="Courier New, monospace" font-size="11" fill="#FBBF24">FK assigned_route_id</text>

  <!-- Table 3: Routes -->
  <rect x="640" y="90" width="220" height="160" rx="8" fill="#1F2937" stroke="#F59E0B" stroke-width="2" filter="url(#shadow3)"/>
  <rect x="640" y="90" width="220" height="35" rx="8" fill="#D97706"/>
  <text x="750" y="113" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Routes</text>
  <text x="655" y="145" font-family="Courier New, monospace" font-size="11" fill="#FBBF24">PK route_id (INT)</text>
  <text x="655" y="165" font-family="Courier New, monospace" font-size="11" fill="#E5E7EB">   route_number (VARCHAR)</text>
  <text x="655" y="185" font-family="Courier New, monospace" font-size="11" fill="#E5E7EB">   route_name (VARCHAR)</text>
  <text x="655" y="205" font-family="Courier New, monospace" font-size="11" fill="#E5E7EB">   distance_km (DOUBLE)</text>
  <text x="655" y="225" font-family="Courier New, monospace" font-size="11" fill="#E5E7EB">   fare (DECIMAL)</text>

  <!-- Table 4: FuelPurchases -->
  <rect x="180" y="320" width="220" height="150" rx="8" fill="#1F2937" stroke="#EC4899" stroke-width="2" filter="url(#shadow3)"/>
  <rect x="180" y="320" width="220" height="35" rx="8" fill="#DB2777"/>
  <text x="290" y="343" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#FFFFFF" text-anchor="middle">FuelPurchases</text>
  <text x="195" y="375" font-family="Courier New, monospace" font-size="11" fill="#F472B6">PK record_id (INT)</text>
  <text x="195" y="395" font-family="Courier New, monospace" font-size="11" fill="#34D399">FK bus_id (INT)</text>
  <text x="195" y="415" font-family="Courier New, monospace" font-size="11" fill="#E5E7EB">   quantity_liters (DOUBLE)</text>
  <text x="195" y="435" font-family="Courier New, monospace" font-size="11" fill="#E5E7EB">   total_cost (DECIMAL)</text>

  <!-- Table 5: GPS_Tracking -->
  <rect x="500" y="320" width="220" height="150" rx="8" fill="#1F2937" stroke="#8B5CF6" stroke-width="2" filter="url(#shadow3)"/>
  <rect x="500" y="320" width="220" height="35" rx="8" fill="#7C3AED"/>
  <text x="610" y="343" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#FFFFFF" text-anchor="middle">GPS_Tracking</text>
  <text x="515" y="375" font-family="Courier New, monospace" font-size="11" fill="#A78BFA">PK tracking_id (INT)</text>
  <text x="515" y="395" font-family="Courier New, monospace" font-size="11" fill="#34D399">FK bus_id (INT)</text>
  <text x="515" y="415" font-family="Courier New, monospace" font-size="11" fill="#E5E7EB">   latitude (DOUBLE)</text>
  <text x="515" y="435" font-family="Courier New, monospace" font-size="11" fill="#E5E7EB">   longitude (DOUBLE)</text>

  <!-- Relation Lines -->
  <!-- Routes -> Buses (1 to N) -->
  <path d="M 640 170 L 570 170" stroke="#FBBF24" stroke-width="2" stroke-dasharray="4,4"/>
  <text x="605" y="160" font-family="Arial, sans-serif" font-size="11" fill="#FBBF24">1 : N</text>

  <!-- Buses -> FuelPurchases (1 to N) -->
  <path d="M 400 290 L 330 320" stroke="#34D399" stroke-width="2" stroke-dasharray="4,4"/>
  <text x="375" y="310" font-family="Arial, sans-serif" font-size="11" fill="#34D399">1 : N</text>

  <!-- Buses -> GPS_Tracking (1 to N) -->
  <path d="M 500 290 L 570 320" stroke="#34D399" stroke-width="2" stroke-dasharray="4,4"/>
  <text x="525" y="310" font-family="Arial, sans-serif" font-size="11" fill="#34D399">1 : N</text>
</svg>