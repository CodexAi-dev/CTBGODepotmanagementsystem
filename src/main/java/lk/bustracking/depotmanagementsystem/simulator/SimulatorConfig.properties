# GPS Simulator Configuration
# Update these settings according to your database setup

# Database Configuration
db.url=jdbc:sqlserver://localhost:1433;databaseName=CTB_BusManagement;trustServerCertificate=true
db.username=sa
db.password=6238

# Simulation Settings
simulation.update_interval_seconds=5
simulation.average_speed_kmh=35.0
