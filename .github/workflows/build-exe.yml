name: Build EXE Release

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'oracle'
        cache: maven
    
    - name: Setup JAVA_HOME
      run: |
        $javaDir = (Get-Command java.exe).Source | Split-Path | Split-Path
        if (-not (Test-Path "$javaDir\bin\javac.exe")) {
          $javaHome = (Get-ItemProperty 'HKEY_LOCAL_MACHINE\SOFTWARE\JavaSoft\JDK\21*' JavaHome -ErrorAction SilentlyContinue).JavaHome | Select-Object -First 1
          if ($javaHome) {
            $javaDir = $javaHome
          }
        }
        echo "JAVA_HOME=$javaDir" >> $env:GITHUB_ENV
        Write-Host "Set JAVA_HOME to: $javaDir"
    
    - name: Display Java version
      run: java -version
    
    - name: Build with Maven
      run: |
        .\mvnw.cmd clean package -DskipTests
    
    - name: List JAR files (Debug)
      run: |
        dir target/*.jar
    
    - name: Copy JAR for consistency
      run: |
        # Copy the built JAR to a consistent name
        if (Test-Path "target/BusTrackingSystem.jar") {
          Copy-Item "target/BusTrackingSystem.jar" "target/app.jar"
        } elseif (Test-Path "target/DepotManagementSystem.jar") {
          Copy-Item "target/DepotManagementSystem.jar" "target/app.jar"
        } elseif (Test-Path "target/bus-tracking-system-1.0.0.jar") {
          Copy-Item "target/bus-tracking-system-1.0.0.jar" "target/app.jar"
        } else {
          # Use wildcard to find the jar
          $jar = Get-ChildItem "target/*.jar" -Exclude "*sources*" -Exclude "*javadoc*" | Select-Object -First 1
          if ($jar) {
            Copy-Item $jar.FullName "target/app.jar"
          }
        }
        dir target/app.jar
    
    - name: Upload JAR Artifact
      uses: actions/upload-artifact@v4
      with:
        name: DepotManagementSystem-JAR
        path: target/app.jar
        retention-days: 30
    
    - name: Download Launch4j
      run: |
        @'
        <project xmlns="http://maven.apache.org/POM/4.0.0">
          <modelVersion>4.0.0</modelVersion>
          <groupId>local.build</groupId>
          <artifactId>launch4j-runner</artifactId>
          <version>1.0</version>
          <dependencies>
            <dependency>
              <groupId>net.sf.launch4j</groupId>
              <artifactId>launch4j</artifactId>
              <version>3.50</version>
            </dependency>
            <dependency>
              <groupId>net.sf.launch4j</groupId>
              <artifactId>launch4j</artifactId>
              <version>3.50</version>
              <classifier>core</classifier>
            </dependency>
            <dependency>
              <groupId>net.sf.launch4j</groupId>
              <artifactId>launch4j</artifactId>
              <version>3.50</version>
              <classifier>workdir-win32</classifier>
            </dependency>
          </dependencies>
        </project>
        '@ | Out-File -FilePath launch4j-pom.xml -Encoding UTF8
        Remove-Item launch4j-lib -Recurse -Force -ErrorAction SilentlyContinue
        .\mvnw.cmd -f launch4j-pom.xml dependency:copy-dependencies -DoutputDirectory=launch4j-lib -DincludeScope=runtime
        $launch4jJars = Get-ChildItem launch4j-lib -Filter "*.jar"
        if (-not $launch4jJars) {
          Write-Host "ERROR: Launch4j artifacts were not downloaded"
          exit 1
        }
        $launch4jJars | Select-Object Name, Length
    
    - name: Create Launch4j Config
      run: |
        @'
        <launch4jConfig>
          <dontWrapJar>false</dontWrapJar>
          <headerType>gui</headerType>
          <jar>target/app.jar</jar>
          <outfile>target/CTBDepotManagement.exe</outfile>
          <errTitle>CTB Depot Management System</errTitle>
          <cmdLine></cmdLine>
          <chdir>.</chdir>
          <priority>normal</priority>
          <downloadUrl>https://www.java.com/download</downloadUrl>
          <supportUrl></supportUrl>
          <stayAlive>false</stayAlive>
          <restartOnCrash>false</restartOnCrash>
          <jre>
            <path></path>
            <bundledJre64Bit>false</bundledJre64Bit>
            <bundledJreAsFallback>false</bundledJreAsFallback>
            <minVersion>21</minVersion>
            <maxVersion></maxVersion>
            <jdkPreference>preferJre</jdkPreference>
            <runtimeBits>64</runtimeBits>
          </jre>
        </launch4jConfig>
        '@ | Out-File -FilePath launch4j-config.xml -Encoding UTF8
    
    - name: Build EXE with Launch4j
      run: |
        # Check if app.jar exists
        if (-not (Test-Path "target/app.jar")) {
          Write-Host "ERROR: app.jar not found!"
          dir target/
          exit 1
        }
        
        # Run the official Launch4j compiler from Maven Central artifacts
        $launch4jClasspath = (Get-ChildItem launch4j-lib -Filter "*.jar" | ForEach-Object FullName) -join ";"
        java -cp $launch4jClasspath net.sf.launch4j.Main launch4j-config.xml
        
        # Check if exe was created
        if (-not (Test-Path "target/CTBDepotManagement.exe")) {
          Write-Host "ERROR: EXE file was not created!"
          exit 1
        }
        
        Write-Host "SUCCESS: EXE created successfully!"
        dir target/CTBDepotManagement.exe
    
    - name: Upload EXE Artifact (if successful)
      uses: actions/upload-artifact@v4
      if: success()
      with:
        name: DepotManagementSystem-EXE
        path: target/CTBDepotManagement.exe
        retention-days: 30
    
    - name: Upload EXE Artifact (continue if failed)
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: DepotManagementSystem-EXE-DEBUG
        path: launch4j-config.xml
        retention-days: 7
    
    - name: Create GitHub Release (on tag)
      uses: softprops/action-gh-release@v1
      if: startsWith(github.ref, 'refs/tags/')
      with:
        files: |
          target/CTBDepotManagement.exe
          target/app.jar
        body: |
          ## Release Notes
          
          **Version:** ${{ github.ref_name }}
          **Build Date:** ${{ github.event.head_commit.timestamp }}
          **Commit:** ${{ github.event.head_commit.message }}
          
          ### Download Options
          
          #### Windows EXE (Recommended) ✅
          - **File:** `CTBDepotManagement.exe`
          - **Size:** ~50-60 MB
          - **Requirements:** Java 21 (installer will check)
          - **Installation:** Just double-click to run
          
          #### Portable JAR
          - **File:** `BusTrackingSystem.jar`
          - **Size:** ~80-100 MB
          - **Requirements:** Java 21 must be installed
          - **Run:** `java -jar BusTrackingSystem.jar`
          
          ### System Requirements
          - **OS:** Windows 7 or later
          - **Java:** Java 21 (Oracle JDK or OpenJDK)
          - **RAM:** 4 GB minimum
          - **Disk:** 500 MB free space
          
          ### Installation Steps
          
          **For EXE:**
          1. Download `CTBDepotManagement.exe`
          2. Double-click to run
          3. Application starts (requires Java 21)
          
          **For JAR:**
          1. Install Java 21 from https://www.oracle.com/java/technologies/
          2. Download `BusTrackingSystem.jar`
          3. Run: `java -jar BusTrackingSystem.jar`
          
          ### Features
          - Real-time GPS tracking simulation
          - Bus fleet management
          - Employee and route management
          - Fuel consumption tracking
          - Dashboard analytics
          
          ---
          Built with GitHub Actions on ${{ github.event.head_commit.timestamp }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
